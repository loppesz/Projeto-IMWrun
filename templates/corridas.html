{% extends 'base.html' %}
{% block title %}Calendário — IMW Run{% endblock %}
{% block content %}

<section class="hero" style="padding:40px 16px">
  <div style="position:relative;z-index:1">
    <div class="hero-tag">📅 Temporada 2025</div>
    <h1 style="font-size:2rem">Calendário IMW Run</h1>
    <p>12 corridas · 5 km cada · Fevereiro a Dezembro</p>
  </div>
</section>

<div class="container section">

  <!-- Resumo -->
  <div class="grid-3 mb-6">
    <div class="stat-card">
      <div class="stat-icon" style="color:#10b981">✅</div>
      <div class="stat-value" style="color:#10b981">2</div>
      <div class="stat-label">Concluídas</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="color:#f59e0b">🔓</div>
      <div class="stat-value" style="color:#f59e0b">1</div>
      <div class="stat-label">Disponível</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="color:#9ca3af">🔒</div>
      <div class="stat-value" style="color:#9ca3af">9</div>
      <div class="stat-label">Bloqueadas</div>
    </div>
  </div>

  <!-- Lista de corridas -->
  <div id="lista-corridas"></div>

</div>

<script>
const corridas = [
  { id:1,  num:1,  nome:'IMW Run #01', data:'15 Fev 2025', hora:'07:00', local:'Parque da Cidade', status:'done',      inscritos:18 },
  { id:2,  num:2,  nome:'IMW Run #02', data:'15 Mar 2025', hora:'07:00', local:'Lago Norte',        status:'done',      inscritos:22 },
  { id:3,  num:3,  nome:'IMW Run #03', data:'12 Abr 2025', hora:'07:00', local:'Asa Sul',           status:'open',      inscritos:7  },
  { id:4,  num:4,  nome:'IMW Run #04', data:'10 Mai 2025', hora:'07:00', local:'A definir',          status:'locked',    inscritos:0  },
  { id:5,  num:5,  nome:'IMW Run #05', data:'14 Jun 2025', hora:'07:00', local:'A definir',          status:'locked',    inscritos:0  },
  { id:6,  num:6,  nome:'IMW Run #06', data:'12 Jul 2025', hora:'07:00', local:'A definir',          status:'locked',    inscritos:0  },
  { id:7,  num:7,  nome:'IMW Run #07', data:'09 Ago 2025', hora:'07:00', local:'A definir',          status:'locked',    inscritos:0  },
  { id:8,  num:8,  nome:'IMW Run #08', data:'13 Set 2025', hora:'07:00', local:'A definir',          status:'locked',    inscritos:0  },
  { id:9,  num:9,  nome:'IMW Run #09', data:'11 Out 2025', hora:'07:00', local:'A definir',          status:'locked',    inscritos:0  },
  { id:10, num:10, nome:'IMW Run #10', data:'08 Nov 2025', hora:'07:00', local:'A definir',          status:'locked',    inscritos:0  },
  { id:11, num:11, nome:'IMW Run #11', data:'06 Dez 2025', hora:'07:00', local:'A definir',          status:'locked',    inscritos:0  },
  { id:12, num:12, nome:'IMW Run #12', data:'20 Dez 2025', hora:'08:00', local:'A definir',          status:'locked',    inscritos:0  },
];

const badgeMap = {
  done:   '<span class="badge badge-blue">✅ Concluída</span>',
  open:   '<span class="badge badge-green">🔓 Disponível</span>',
  locked: '<span class="badge badge-gray">🔒 Bloqueada</span>',
};

const iconMap = {
  done: '✅', open: '🔓', locked: '🔒',
};

const colorMap = {
  done:   '#1e40af', open: '#f59e0b', locked: '#e5e7eb',
};

const lista = document.getElementById('lista-corridas');
corridas.forEach(c => {
  const actionBtn = c.status === 'open'
    ? `<a href="/corrida/${c.id}" class="btn btn-primary btn-sm w-full mt-3">Inscreva-se →</a>`
    : c.status === 'done'
    ? `<a href="/corrida/${c.id}" class="btn btn-ghost btn-sm w-full mt-3" style="border:1.5px solid #e5e7eb">Ver resultados</a>`
    : '';

  lista.innerHTML += `
    <div class="card mb-4 fade-in" style="opacity:${c.status==='locked'?'0.7':'1'}">
      <div class="card-body" style="display:flex;gap:16px;align-items:flex-start">
        <div style="width:48px;height:48px;border-radius:14px;background:${colorMap[c.status]};display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;color:white">${iconMap[c.status]}</div>
        <div style="flex:1">
          <div class="flex justify-between items-center">
            <h3 style="font-weight:800">${c.nome}</h3>
            ${badgeMap[c.status]}
          </div>
          <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">
            <span style="font-size:0.8rem;color:var(--gray)">📅 ${c.data}</span>
            <span style="font-size:0.8rem;color:var(--gray)">🕐 ${c.hora}</span>
            <span style="font-size:0.8rem;color:var(--gray)">📍 ${c.local}</span>
            <span style="font-size:0.8rem;color:var(--gray)">👥 ${c.inscritos} inscritos</span>
          </div>
          ${actionBtn}
        </div>
      </div>
    </div>`;
});
</script>
{% endblock %}
