{% extends 'admin/base_admin.html' %}
{% block title %}Corridas — Admin IMW Run{% endblock %}
{% block content %}

<div class="admin-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
  <div>
    <h1 class="admin-title">🏁 Corridas</h1>
    <p class="admin-subtitle">Gerenciar todas as corridas da temporada</p>
  </div>
  <button class="btn btn-primary btn-sm" onclick="abrirModal()">+ Nova corrida</button>
</div>

<div style="background:#1f2937;border-radius:16px;overflow:hidden">
  <table style="background:transparent">
    <thead><tr>
      <th style="color:#6b7280">#</th>
      <th style="color:#6b7280">Corrida</th>
      <th style="color:#6b7280">Data</th>
      <th style="color:#6b7280">Status</th>
      <th style="color:#6b7280">Inscritos</th>
      <th style="color:#6b7280">Ações</th>
    </tr></thead>
    <tbody id="tabela-corridas"></tbody>
  </table>
</div>

<!-- Modal nova corrida -->
<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;align-items:center;justify-content:center;padding:16px">
  <div style="background:#1f2937;border-radius:20px;padding:24px;width:100%;max-width:440px">
    <h2 style="color:white;font-weight:800;margin-bottom:20px">+ Nova corrida</h2>
    <div class="form-group"><label class="form-label" style="color:#9ca3af">Nome</label><input class="form-input" style="background:#374151;border-color:#4b5563;color:white" placeholder="IMW Run #04" /></div>
    <div class="form-group"><label class="form-label" style="color:#9ca3af">Data</label><input class="form-input" type="date" style="background:#374151;border-color:#4b5563;color:white" /></div>
    <div class="form-group"><label class="form-label" style="color:#9ca3af">Local</label><input class="form-input" style="background:#374151;border-color:#4b5563;color:white" placeholder="Parque da Cidade, Brasília/DF" /></div>
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn btn-primary" style="flex:1" onclick="fecharModal()">Salvar</button>
      <button class="btn btn-ghost" style="flex:1;color:#9ca3af" onclick="fecharModal()">Cancelar</button>
    </div>
  </div>
</div>

<script>
const corridas = [
  { num:1,  nome:'IMW Run #01', data:'15 Fev 2025', local:'Parque da Cidade', status:'done',   inscritos:18 },
  { num:2,  nome:'IMW Run #02', data:'15 Mar 2025', local:'Lago Norte',        status:'done',   inscritos:22 },
  { num:3,  nome:'IMW Run #03', data:'12 Abr 2025', local:'Asa Sul',           status:'open',   inscritos:7  },
  { num:4,  nome:'IMW Run #04', data:'10 Mai 2025', local:'A definir',          status:'locked', inscritos:0  },
  { num:5,  nome:'IMW Run #05', data:'14 Jun 2025', local:'A definir',          status:'locked', inscritos:0  },
  { num:6,  nome:'IMW Run #06', data:'12 Jul 2025', local:'A definir',          status:'locked', inscritos:0  },
];

const badgeMap = {
  done:   '<span class="badge badge-blue">✅ Concluída</span>',
  open:   '<span class="badge badge-green">🔓 Disponível</span>',
  locked: '<span class="badge badge-gray">🔒 Bloqueada</span>',
};

const tbody = document.getElementById('tabela-corridas');
corridas.forEach(c => {
  tbody.innerHTML += `
    <tr>
      <td style="color:#9ca3af;font-weight:700">${c.num}</td>
      <td><p style="color:white;font-weight:600">${c.nome}</p><p style="font-size:0.72rem;color:#9ca3af">${c.local}</p></td>
      <td style="color:#9ca3af">${c.data}</td>
      <td>${badgeMap[c.status]}</td>
      <td style="color:#9ca3af">${c.inscritos}</td>
      <td>
        <div style="display:flex;gap:6px">
          <button style="background:#374151;border:none;border-radius:8px;padding:5px 10px;color:#9ca3af;font-size:0.75rem;cursor:pointer">Editar</button>
          ${c.status==='locked'
            ? `<button style="background:#065f46;border:none;border-radius:8px;padding:5px 10px;color:#6ee7b7;font-size:0.75rem;cursor:pointer">Liberar</button>`
            : c.status==='open'
            ? `<button style="background:#374151;border:none;border-radius:8px;padding:5px 10px;color:#9ca3af;font-size:0.75rem;cursor:pointer">Bloquear</button>`
            : ''}
        </div>
      </td>
    </tr>`;
});

function abrirModal()  { document.getElementById('modal').style.display = 'flex'; }
function fecharModal() { document.getElementById('modal').style.display = 'none'; }
</script>
{% endblock %}
