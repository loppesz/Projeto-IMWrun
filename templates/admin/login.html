<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin — IMW Run</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <style>body{background:#111827;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}</style>
</head>
<body>
  <div style="width:100%;max-width:360px">
    <div style="text-align:center;margin-bottom:28px">
      <div style="width:60px;height:60px;background:var(--primary);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 12px;box-shadow:0 8px 24px rgba(30,64,175,0.4)">🔐</div>
      <h1 style="color:white;font-size:1.5rem;font-weight:900">Área Admin</h1>
      <p style="color:#9ca3af;font-size:0.875rem;margin-top:4px">IMW Run — Painel de controle</p>
    </div>

    <div style="background:#1f2937;border-radius:20px;padding:24px">
      <div class="form-group">
        <label class="form-label" style="color:#9ca3af">E-mail</label>
        <input id="email" class="form-input" style="background:#374151;border-color:#4b5563;color:white" type="email" placeholder="admin@imwrun.com" />
      </div>
      <div class="form-group">
        <label class="form-label" style="color:#9ca3af">Senha</label>
        <input id="senha" class="form-input" style="background:#374151;border-color:#4b5563;color:white" type="password" placeholder="••••••••" />
      </div>
      <div id="erro" style="display:none;background:#450a0a;color:#fca5a5;border-radius:10px;padding:10px 14px;font-size:0.875rem;margin-bottom:12px"></div>
      <button class="btn btn-primary w-full" onclick="entrar()">Entrar →</button>
      <p style="text-align:center;font-size:0.72rem;color:#4b5563;margin-top:12px">admin@imwrun.com / admin123</p>
    </div>
  </div>

  <script>
  function entrar() {
    const email = document.getElementById('email').value;
    const senha = document.getElementById('senha').value;
    const erro  = document.getElementById('erro');
    if (email === 'admin@imwrun.com' && senha === 'admin123') {
      window.location.href = '/admin';
    } else {
      erro.textContent = 'E-mail ou senha incorretos.';
      erro.style.display = 'block';
    }
  }
  document.addEventListener('keydown', e => { if(e.key==='Enter') entrar(); });
  </script>
</body>
</html>
