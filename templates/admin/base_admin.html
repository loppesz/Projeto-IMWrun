<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Admin — IMW Run{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <style>
    body { background: #111827; }
    .admin-wrap { display: flex; min-height: 100vh; }
    .admin-side {
      width: 220px; flex-shrink: 0; background: #1f2937;
      padding: 24px 0; position: sticky; top: 0; height: 100vh;
    }
    .admin-logo { padding: 0 20px 20px; font-size: 1rem; font-weight: 800; color: white; border-bottom: 1px solid #374151; }
    .admin-menu { padding: 12px 0; }
    .admin-link {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 20px; font-size: 0.875rem; font-weight: 500;
      color: #9ca3af; transition: all 0.15s; text-decoration: none;
    }
    .admin-link:hover, .admin-link.active { color: white; background: rgba(255,255,255,0.05); }
    .admin-link.active { border-left: 3px solid var(--primary); color: white; }
    .admin-body { flex: 1; padding: 32px; overflow-y: auto; }
    .admin-header { margin-bottom: 24px; }
    .admin-title { font-size: 1.5rem; font-weight: 800; color: white; }
    .admin-subtitle { color: #9ca3af; font-size: 0.875rem; margin-top: 4px; }

    @media (max-width: 767px) {
      .admin-side { display: none; }
      .admin-body { padding: 16px; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<div class="admin-wrap">
  <aside class="admin-side">
    <div class="admin-logo">🔐 IMW Admin</div>
    <nav class="admin-menu">
      <a href="/admin" class="admin-link {% if request.path == '/admin' %}active{% endif %}">📊 Dashboard</a>
      <a href="/admin/ao-vivo" class="admin-link {% if '/ao-vivo' in request.path %}active{% endif %}" style="color:#f59e0b">🔴 Ao Vivo</a>
      <a href="/admin/corridas" class="admin-link {% if '/admin/corridas' in request.path %}active{% endif %}">🏁 Corridas</a>
      <a href="/admin/grupos" class="admin-link {% if '/admin/grupos' in request.path %}active{% endif %}">👥 Grupos</a>
      <a href="/admin/inscritos" class="admin-link {% if '/admin/inscritos' in request.path %}active{% endif %}">📋 Inscritos</a>
      <a href="/" class="admin-link" style="margin-top:auto">🌐 Ver site</a>
    </nav>
  </aside>
  <main class="admin-body">
    {% block content %}{% endblock %}
  </main>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
